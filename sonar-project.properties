# SonarQube Cloud (sonarcloud.io) configuration.
# Project and organization keys come from the SonarCloud project page
# (Administration -> Update Key). Both default to the GitHub slug on import.
sonar.projectKey=ventura8_Auto-Subtitle-Generator
sonar.organization=ventura8

sonar.projectName=Auto-Subtitle-Generator
# No sonar.projectVersion on purpose: it would be a second place to bump on every
# release and would silently drift from pyproject.toml. Sonar dates analyses instead.

# --- Analysis scope ---
# Product code only. Tests are declared separately so Sonar applies test rules
# to them and never counts them toward coverage or duplication on new code.
# Includes the Go launcher, the CI workflows, the Dockerfiles and the shell
# installers: the first automatic analysis found real GitHub Actions and Docker
# security findings in those, which a Python-only scope would silently drop.
sonar.sources=auto_subtitle.py,modules,launcher,docker,scripts,.github,install_dependencies.sh,start.sh,run_local_pipeline.sh
sonar.tests=tests

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Type-stub packages carry no runtime behaviour and would otherwise be reported
# as uncovered product code.
sonar.exclusions=typings/**,assets/**,**/__pycache__/**

# --- Coverage ---
# Produced by the "Run Tests with Coverage" job; paths inside are repo-root
# relative, which is what Sonar expects.
sonar.python.coverage.reportPaths=coverage.xml

# CI runs gofmt, go vet and go test over the launcher, but its coverage profile
# is not imported: the launcher is built from a bare main.go with no go.mod, so
# the profile names the synthetic `command-line-arguments` package and Sonar
# cannot map it back to the file. Excluding it from the coverage metric keeps
# that from reading as 0 %. Static analysis still applies, so its bugs and
# vulnerabilities continue to fail the gate. Import the profile here once the
# launcher gains a real module path.
sonar.coverage.exclusions=launcher/**

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  POETRY_VERSION: "2.4.1"

jobs:
  static_analysis:
    name: "🔍 Static Quality Verification"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Setup Poetry Environment
        uses: ./.github/actions/setup-poetry-env
        with:
          python-version: '3.12.13'
          poetry-version: ${{ env.POETRY_VERSION }}
      - name: Run PowerShell Lint
        shell: pwsh
        run: |
          $scriptPaths = @("./install_dependencies.ps1", "./run_local_pipeline.ps1")
          & ./.github/scripts/Invoke-PowerShellLint.ps1 -ScriptPaths $scriptPaths
      - name: Run Ruff
        run: |
          poetry run ruff check .
      - name: Run Flake8
        run: |
          poetry run flake8 modules auto_subtitle.py
      - name: Run Pylint
        run: |
          poetry run pylint modules auto_subtitle.py

  technical_validation:
    name: "🧪 Automated Pipeline Validation"
    needs: static_analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Setup Poetry Environment
        uses: ./.github/actions/setup-poetry-env
        with:
          python-version: '3.12.13'
          poetry-version: ${{ env.POETRY_VERSION }}
      - name: Run Tests with Coverage
        run: |
          poetry run pytest --cov=auto_subtitle --cov=modules --cov-branch --cov-report=xml --cov-report=json --cov-report=term --cov-fail-under=90 tests/
      - name: Enforce Per-File Coverage >= 90%
        run: |
          poetry run coverage report --include=auto_subtitle.py --fail-under=90 -m
          poetry run coverage report --include=modules/config.py --fail-under=90 -m
          poetry run coverage report --include=modules/isolated_translator.py --fail-under=90 -m
          poetry run coverage report --include=modules/models.py --fail-under=90 -m
          poetry run coverage report --include=modules/transcription.py --fail-under=90 -m
          poetry run coverage report --include=modules/translation.py --fail-under=90 -m
          poetry run coverage report --include=modules/utils.py --fail-under=90 -m
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-artifacts
          path: |
            coverage.xml
            coverage.json
            .coverage

  quality_reporting:
    name: "📊 Analytics & Coverage Reporting"
    needs: technical_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Setup Poetry Environment
        uses: ./.github/actions/setup-poetry-env
        with:
          python-version: '3.12.13'
          poetry-version: ${{ env.POETRY_VERSION }}
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-artifacts
      - name: Generate Badge and Summary
        run: |
          poetry run python tests/transform_metrics.py coverage.xml assets/coverage.svg
          cat coverage_summary.md >> $GITHUB_STEP_SUMMARY

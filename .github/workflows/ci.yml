name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  POETRY_VERSION: "2.4.1"

jobs:
  static_analysis:
    name: "🔍 Static Quality Verification"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            poetry.lock

      - name: Set up Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "lts/*"

      - name: Install Poetry
        run: |
          python -m pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Configure Poetry In-Project Virtualenv
        run: |
          poetry config virtualenvs.in-project true

      - name: Ensure Poetry lockfile is fresh
        run: |
          if [ ! -f poetry.lock ]; then
            echo "poetry.lock not found. Generating lockfile..."
            poetry lock --no-interaction
          elif ! poetry check >/dev/null 2>&1; then
            echo "poetry.lock is out of date. Regenerating lockfile..."
            poetry lock --no-interaction
            poetry check
          fi

      - name: Install Test Dependencies (main + dev, no ml)
        run: |
          poetry install -v --only main,dev --no-root

      - name: Enforce zero-suppression policy
        run: |
          poetry run python tests/tools/check_no_suppressions.py

      - name: Run PowerShell Lint
        shell: pwsh
        run: |
          $scriptPaths = @(
            "./install_dependencies.ps1",
            "./run_local_pipeline.ps1",
            "./.github/scripts/Invoke-PowerShellLint.ps1"
          )
          & ./.github/scripts/Invoke-PowerShellLint.ps1 -ScriptPaths $scriptPaths -MaxCyclomaticComplexity 9 -MaxNestingDepth 4

      - name: Run Markdown auto-delinter (mdformat)
        run: |
          poetry run mdformat README.md AGENTS.md docs .github

      - name: Run Markdown linter (pymarkdown)
        run: |
          poetry run pymarkdown scan README.md AGENTS.md docs .github

      - name: Run isort import order check
        run: |
          poetry run isort --check-only --filter-files auto_subtitle.py modules tests

      - name: Run Black format check
        run: |
          poetry run black --check auto_subtitle.py modules tests

      - name: Run Taplo format check
        run: |
          poetry run taplo format --check pyproject.toml poetry.toml

      - name: Run Ruff
        run: |
          poetry run ruff check modules auto_subtitle.py tests

      - name: Run Ruff format check
        run: |
          poetry run ruff format --check .

      - name: Run Flake8
        run: |
          poetry run flake8 modules auto_subtitle.py tests

      - name: Run Pylint
        run: |
          poetry run pylint modules auto_subtitle.py

      - name: Run Pylint on tests (errors-only)
        run: |
          PYTHONPATH=. poetry run pylint tests --errors-only

      - name: Run mypy
        run: |
          poetry run mypy auto_subtitle.py modules tests

      - name: Run pyright
        run: |
          poetry run pyright auto_subtitle.py modules tests

      - name: Run Bandit Security Scan (high severity/high confidence)
        run: |
          poetry run bandit -c pyproject.toml -q -r auto_subtitle.py modules -lll -iii

      - name: Run dependency vulnerability scan (pip-audit)
        run: |
          poetry run pip-audit

      - name: Run Radon Complexity (A-grade enforced)
        run: |
          poetry run radon cc auto_subtitle.py modules tests/modules tests/orchestration -s -a | tee radon_report.txt

          {
            echo "## Radon Cyclomatic Complexity"
            echo ""
            echo '```text'
            cat radon_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -E "\s-\s[B-F]\s\(" radon_report.txt >/dev/null; then
            echo "Radon complexity gate failed. Non-A grades were found." >&2
            exit 1
          fi

      - name: Run Radon Maintainability Index (A-grade enforced)
        run: |
          poetry run radon mi auto_subtitle.py modules tests/modules tests/orchestration -s | tee radon_mi_report.txt

          {
            echo "## Radon Maintainability Index (A-grade enforced)"
            echo ""
            echo '```text'
            cat radon_mi_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -E "\s-\s[B-F]\s\(" radon_mi_report.txt >/dev/null; then
            echo "Radon MI gate failed. Non-A grades were found." >&2
            exit 1
          fi

      - name: Run Radon Halstead Metrics (hal)
        run: |
          poetry run radon hal auto_subtitle.py modules tests/modules tests/orchestration | tee radon_hal_report.txt

          {
            echo "## Radon Halstead Metrics"
            echo ""
            echo '```text'
            cat radon_hal_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  technical_validation:
    name: "🧪 Automated Pipeline Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            poetry.lock

      - name: Install Poetry
        run: |
          python -m pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Configure Poetry In-Project Virtualenv
        run: |
          poetry config virtualenvs.in-project true

      - name: Ensure Poetry lockfile is fresh
        run: |
          if [ ! -f poetry.lock ]; then
            echo "poetry.lock not found. Generating lockfile..."
            poetry lock --no-interaction
          elif ! poetry check >/dev/null 2>&1; then
            echo "poetry.lock is out of date. Regenerating lockfile..."
            poetry lock --no-interaction
            poetry check
          fi

      - name: Install Test Dependencies (main + dev, no ml)
        run: |
          poetry install -v --only main,dev --no-root

      - name: Run Tests with Coverage
        run: |
          poetry run pytest -m "not e2e" --cov=auto_subtitle --cov=modules --cov-branch --cov-report=xml --cov-report=json --cov-report=term --cov-fail-under=90 tests/

      - name: Enforce Per-File Coverage >= 90%
        run: |
          poetry run coverage report --include=auto_subtitle.py --fail-under=90 -m
          poetry run coverage report --include=modules/configuration/config.py --fail-under=90 -m
          poetry run coverage report --include=modules/pipeline/isolated_translator.py --fail-under=90 -m
          poetry run coverage report --include=modules/models.py --fail-under=90 -m
          poetry run coverage report --include=modules/pipeline/transcription.py --fail-under=90 -m
          poetry run coverage report --include=modules/pipeline/translation.py --fail-under=90 -m
          poetry run coverage report --include=modules/utils.py --fail-under=90 -m

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-artifacts
          path: |
            coverage.xml
            coverage.json
            .coverage

  quality_reporting:
    name: "📊 Analytics & Coverage Reporting"
    needs: [static_analysis, technical_validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            poetry.lock

      - name: Install Poetry
        run: |
          python -m pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Configure Poetry In-Project Virtualenv
        run: |
          poetry config virtualenvs.in-project true

      - name: Ensure Poetry lockfile is fresh
        run: |
          if [ ! -f poetry.lock ]; then
            echo "poetry.lock not found. Generating lockfile..."
            poetry lock --no-interaction
          elif ! poetry check >/dev/null 2>&1; then
            echo "poetry.lock is out of date. Regenerating lockfile..."
            poetry lock --no-interaction
            poetry check
          fi

      - name: Install Test Dependencies (main + dev, no ml)
        run: |
          poetry install -v --only main,dev --no-root

      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-artifacts

      - name: Generate Badge and Summary
        run: |
          poetry run python tests/tools/transform_metrics.py coverage.xml assets/coverage.svg
          cat coverage_summary.md >> $GITHUB_STEP_SUMMARY

  e2e_real_dependencies:
    name: "🚀 Real Dependencies E2E (${{ matrix.os }})"
    needs: [static_analysis, technical_validation]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
        shell: pwsh

      - name: Install Poetry
        run: python -m pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Configure Poetry In-Project Virtualenv
        run: poetry config virtualenvs.in-project true

      - name: Install Real ML & Test Dependencies (Linux)
        if: runner.os == 'Linux'
        run: poetry install -v --with ml,dev --no-root
        env:
          POETRY_REQUESTS_TIMEOUT: "300"

      - name: Install E2E Test Dependencies (macOS/Windows)
        if: runner.os != 'Linux'
        run: poetry install -v --only main,dev --no-root

      - name: Run Real Dependencies E2E Test Suite (Linux)
        if: runner.os == 'Linux'
        run: poetry run pytest -m e2e tests/e2e/test_real_pipeline.py -v

      - name: Run Real Dependencies E2E Smoke Tests (macOS)
        if: runner.os == 'macOS'
        run: poetry run pytest -m e2e -k "not real_nllb_translator_cpu_execution" tests/e2e/test_real_pipeline.py -v

      - name: Run Real Dependencies E2E Smoke Tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: poetry run pytest -m e2e -k "not real_nllb_translator_cpu_execution" tests/e2e/test_real_pipeline.py -v

name: Release

# Trigger on version tags like v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  github-release:
    name: "🚀 GitHub Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12.13"

      - name: Extract and verify version from tag
        run: |
          chmod +x scripts/release-verify-tag-version.sh
          ./scripts/release-verify-tag-version.sh

      - name: Check for authored release description
        id: notes
        run: |
          BODY_FILE="docs/releases/v${VERSION}_github_description.md"
          if [ -f "${BODY_FILE}" ]; then
            echo "use_body=true" >> "${GITHUB_OUTPUT}"
          else
            echo "use_body=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create GitHub Release (authored description)
        if: steps.notes.outputs.use_body == 'true'
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          body_path: docs/releases/v${{ env.VERSION }}_github_description.md
          draft: false
          prerelease: false

      - name: Create GitHub Release (auto-generated notes fallback)
        if: steps.notes.outputs.use_body == 'false'
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

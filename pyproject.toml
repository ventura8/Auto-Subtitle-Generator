[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "auto-subtitle-generator"
version = "1.1.0"
description = "Auto-Subtitle Generator using Faster Whisper and optional Translation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]
authors = [
    { name = "Sergiu Alexandrescu", email = "alexandrescu.sergiu@gmail.com" }
]

[tool.poetry]
packages = [
    { include = "auto_subtitle.py" },
    { include = "modules" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
torch = { version = "*", source = "pytorch-cu128", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
torchvision = { version = "*", source = "pytorch-cu128", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
torchaudio = { version = "*", source = "pytorch-cu128", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
faster-whisper = "^1.2.1"
transformers = "^5.0.0"
sentencepiece = "^0.2.1"
accelerate = "^1.12.0"
nvidia-cudnn-cu12 = "^9.18.1"
nvidia-cublas-cu12 = "12.8.4.1"
audio-separator = { version = "^0.41.1", extras = ["gpu"] }
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
mypy = "*"
radon = "*"
pylint = "*"
flake8 = "*"
ruff = "*"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "C90"]
mccabe = { max-complexity = 9 }

[tool.pylint]
master.ignore = [".git", "venv", ".venv"]
reports.output-format = "colorized"

[tool.pylint.format]
max-line-length = 140

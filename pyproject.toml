[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "auto-subtitle-generator"
version = "1.2.7"
description = "Auto-Subtitle Generator using Faster Whisper and optional Translation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]
authors = [
  { name = "Sergiu Alexandrescu", email = "alexandrescu.sergiu@gmail.com" },
]

[tool.poetry]
packages = [{ include = "auto_subtitle.py" }, { include = "modules" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pyyaml = "^6.0.3"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
torch = [
  { version = "2.14.0+cu132", source = "pytorch-cu132", markers = "platform_system != 'Darwin'" },
  { version = ">=2.14,<2.15", markers = "platform_system == 'Darwin'" },
]
torchvision = [
  { version = "0.29.0+cu132", source = "pytorch-cu132", markers = "platform_system != 'Darwin'" },
  { version = ">=0.29,<0.30", markers = "platform_system == 'Darwin'" },
]
faster-whisper = "^1.2.1"
transformers = "^5.17.0"
sentencepiece = "^0.2.2"
accelerate = "^1.15.0"
# Do not pin nvidia-cublas, nvidia-cuda-nvrtc or nvidia-nvjitlink here. torch pulls
# cuda-toolkit, and the two torch entries below resolve to different
# cuda-toolkit versions (13.2.1 for the +cu132 build, 13.0.3 for the plain
# PyPI build the Darwin entry selects), which demand different nvrtc pins;
# pinning one breaks the other branch. The resolver picks them correctly on
# its own; nvidia-cudnn-cu13 stays pinned only because both torch builds agree
# on 9.24.0.43. The markers deliberately carry only platform_system: requires-python
# already pins 3.12, so repeating python_version/implementation_name on every
# entry only enlarges the marker space Poetry has to intersect.
nvidia-cudnn-cu13 = { version = "9.24.0.43", markers = "platform_system != 'Darwin'" }
audio-separator = [
  { version = "^0.47.0", extras = [
    "gpu",
  ], markers = "platform_system != 'Darwin'" },
  { version = "^0.47.0", extras = [
    "cpu",
  ], markers = "platform_system == 'Darwin'" },
]
audioread = "^3.1.0"
librosa = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
radon = "^6.0.1"
pylint = "^4.0.8"
flake8 = "^7.3.0"
black = "^26.5.1"
isort = "^9.0.1"
taplo = "^0.9.3"
ruff = "^0.16.8"
mypy = "^2.3.1"
pyright = "^1.1.414"
bandit = "^1.9.4"
pip-audit = "^2.10.1"
genbadge = "^1.1.3"
types-pyyaml = "^6.0.12.20260906"
mdformat = "^1.0.0"
pymarkdownlnt = "^0.9.40"

[[tool.poetry.source]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
priority = "explicit"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "C90"]
mccabe = { max-complexity = 9 }

[tool.isort]
profile = "black"
line_length = 140
py_version = 312

[tool.black]
line-length = 140
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]

[tool.pylint]
master.ignore = [".git", "venv", ".venv"]
reports.output-format = "colorized"

[tool.pylint.format]
max-line-length = 140

[tool.mypy]
python_version = "3.12"
mypy_path = ["typings"]
namespace_packages = true
explicit_package_bases = true
